<!DOCTYPE html>
<html>

<head>
    <title>Candidate Ranking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f3f5;
        }

        .score {
            font-weight: bold;
        }

        .shortlisted {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🏆 Candidate Ranking</h1>

        <table>

            <tr>
                <th>Rank</th>
                <th>Candidate Resume</th>
                <th>Final Score</th>
                <th>Recommendation</th>
            </tr>

            {% for candidate in candidates %}

            <tr>

                <td>{{ loop.index }}</td>

                <td>{{ candidate.filename }}</td>

                <td class="score">
                    {{ "%.2f"|format(candidate.final_score) }}%
                </td>

                <td class="shortlisted">
                    {{ candidate.recommendation }}
                </td>

            </tr>

            {% endfor %}

        </table>

        <br>

        <div style="text-align:center;">
            <a href="/">Screen More Resumes</a>
        </div>

    </div>

</body>

</html>
